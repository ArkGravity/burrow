name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: Choose regression coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      full_regression: ${{ steps.plan.outputs.full_regression }}
    steps:
      - uses: actions/checkout@v4
      - name: Require full regression unless the merged PR tested this exact tree
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/verification.py plan

  web:
    needs: [plan]
    if: needs.plan.outputs.full_regression == 'true'
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build frontend
        run: bun run build

  backend-quality:
    needs: [plan]
    if: needs.plan.outputs.full_regression == 'true'
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Static analysis
        run: make lint
      - name: Release gate, packaging and image publication regression tests
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: CI verification reuse and job aggregation regression tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

  backend-test:
    needs: [plan]
    if: needs.plan.outputs.full_regression == 'true'
    name: Backend SQLite and PostgreSQL tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: burrow
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: burrow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U burrow -d burrow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BURROW_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=burrow password=ci-test-only dbname=burrow_test sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race tests on both database drivers
        run: make test-db

  browser:
    needs: [plan]
    if: needs.plan.outputs.full_regression == 'true'
    name: Browser and OIDC regression tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install locked frontend dependencies
        run: make web-install
      - name: Install Chromium and system dependencies
        run: bun x playwright install --with-deps chromium
        working-directory: web
      - name: Run browser tests with independent OIDC clients
        run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.arch }}
          path: web/test-results/

  image-build:
    name: Docker build and Compose validation (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    services:
      postgres:
        # PR/dev builds need no extra database; main tests the actual image.
        image: ${{ github.ref == 'refs/heads/main' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_USER: burrow
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: burrow_image_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U burrow -d burrow_image_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BURROW_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=burrow password=ci-test-only dbname=burrow_image_test sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: make compose-config COMPOSE_ENV=.env.example
      - uses: docker/setup-buildx-action@v3
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: type=sha,prefix=main-,format=short
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: burrow:ci-${{ matrix.arch }}
          build-args: COMMIT=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=burrow-image-${{ matrix.arch }}
          cache-to: type=gha,scope=burrow-image-${{ matrix.arch }},mode=max
      - name: Test production image startup with PostgreSQL
        if: github.ref == 'refs/heads/main'
        run: bash scripts/release/smoke-image.sh "burrow:ci-${{ matrix.arch }}"
      - name: Save verified image for main publication
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p bin
          docker save --output "bin/image-$IMAGE_ARCH.tar" "burrow:ci-$IMAGE_ARCH"
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          name: ci-image-${{ matrix.arch }}
          path: bin/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Keep the existing check name while collecting every verification job.
  verify:
    if: always()
    needs: [plan, web, backend-quality, backend-test, browser, image-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every check selected by the regression plan
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/verification.py verify
      - name: Record the exact tree tested by this PR
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/verification.py record
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: ci-verification
          path: verification.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  image:
    name: Publish dual-architecture images to GHCR and Docker Hub
    if: "!cancelled() && needs.verify.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'"
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'logic3579' }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'logic3579' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-image-*
          merge-multiple: true
          path: bin
      - name: Restore pinned digest image publisher
        id: crane-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/burrow-crane/crane
          key: crane-${{ runner.os }}-${{ runner.arch }}-v0.22.1
      - uses: actions/setup-go@v5
        if: steps.crane-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Install digest image publisher
        if: steps.crane-cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/burrow-crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - name: Add digest publisher to PATH
        run: echo "$RUNNER_TEMP/burrow-crane" >>"$GITHUB_PATH"
      - name: Check publishing configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo '::error::Set DOCKERHUB_USERNAME variable'; exit 1; }
          test -n "$DOCKERHUB_NAMESPACE" || { echo '::error::Set DOCKERHUB_NAMESPACE variable'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo '::error::Set DOCKERHUB_TOKEN secret'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push saved images and assemble matching multi-platform indexes
        run: bash scripts/release/publish-images.sh "main-${GITHUB_SHA:0:7}" ci "$PWD/bin" "$PWD/bin/IMAGES.txt"
