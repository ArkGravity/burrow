name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: burrow
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: burrow_test
        ports: ["5432:5432"]
        options: --health-cmd='pg_isready -U burrow' --health-interval=5s --health-retries=10
    env:
      BURROW_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=burrow password=ci-test-only dbname=burrow_test sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run typecheck && bun run test
        working-directory: web
      - run: bun x playwright install --with-deps chromium
        working-directory: web
      - run: bun install --frozen-lockfile
        working-directory: examples/spa-client
      - run: sh web/e2e/run.sh
      - run: docker compose config --quiet
        env:
          BURROW_DB_DSN: host=postgres user=burrow password=ci-test-only dbname=burrow sslmode=disable
          POSTGRES_PASSWORD: ci-test-only
          BURROW_MASTER_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
