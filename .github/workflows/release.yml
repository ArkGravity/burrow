name: Release

on:
  push:
    tags: ["v*"]
  # Select an existing version tag when retrying; branch refs are rejected.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
      build_time: ${{ steps.validate.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main commit, successful CI and an unpublished version
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/validate.sh

  prepare:
    needs: [validate]
    name: Prepare and test release (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: burrow
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: burrow_release_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U burrow -d burrow_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_ARCH: ${{ matrix.arch }}
      BURROW_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=burrow password=ci-test-only dbname=burrow_release_test sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: docker/setup-buildx-action@v3
      - name: Build and load the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          sbom: false
          tags: burrow:release-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            COMMIT=${{ needs.validate.outputs.commit }}
            BUILD_TIME=${{ needs.validate.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.commit }}
            org.opencontainers.image.created=${{ needs.validate.outputs.build_time }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=burrow-image-${{ matrix.arch }}
          cache-to: type=gha,scope=burrow-image-${{ matrix.arch }},mode=max
      - name: Extract and package the exact image binary
        run: |
          mkdir -p bin release-assets
          container=$(docker create "burrow:release-$RELEASE_ARCH")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/burrow" bin/burrow
          chmod +x bin/burrow
          bin/burrow version | tee bin/version.txt
          grep -Fx "burrow $RELEASE_VERSION" bin/version.txt
          grep -Fx "commit: $RELEASE_COMMIT" bin/version.txt
          bash scripts/release/package.sh "$RELEASE_VERSION" "$RELEASE_ARCH" "$PWD/bin/burrow" "$PWD/release-assets"
          cd release-assets
          sha256sum --check "SHA256SUMS-$RELEASE_ARCH"
          tar -xzf "burrow_${RELEASE_VERSION}_linux_${RELEASE_ARCH}.tar.gz" -C "$RUNNER_TEMP"
      - name: Install browser dependencies
        run: |
          make web-install
          cd web
          bun x playwright install --with-deps chromium
      - name: Test the packaged binary with SQLite, MFA and OIDC browsers
        env:
          BURROW_E2E_BINARY: ${{ runner.temp }}/burrow_${{ needs.validate.outputs.version }}_linux_${{ matrix.arch }}/burrow
        run: make test-e2e
      - name: Test production container startup with PostgreSQL
        run: bash scripts/release/smoke-image.sh "burrow:release-$RELEASE_ARCH"
      - name: Save tested image for publication without rebuilding
        run: docker save --output "bin/image-$RELEASE_ARCH.tar" "burrow:release-$RELEASE_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ matrix.arch }}
          path: bin/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-browser-results-${{ matrix.arch }}
          path: web/test-results/

  draft:
    needs: [validate, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'logic3579' }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'logic3579' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recheck release eligibility before publishing artifacts
        run: bash scripts/release/validate.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-inputs
      - name: Verify both architecture archives and assemble shared attachments
        run: bash scripts/release/assemble.sh "$RELEASE_VERSION" "$PWD/release-inputs" "$PWD/release-assets"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-image-*
          merge-multiple: true
          path: bin
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install digest image publisher
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - name: Check registry configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_NAMESPACE"
          test -n "$DOCKERHUB_TOKEN"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested images and require matching public multi-platform indexes
        run: |
          bash scripts/release/publish-images.sh "$RELEASE_VERSION" release "$PWD/bin" "$PWD/release-assets/IMAGES.txt"
          cd release-assets
          sha256sum IMAGES.txt >>SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create or update a draft with all attachments
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          state=$(jq -sr --arg tag "$RELEASE_VERSION" '[.[][] | select(.tag_name == $tag)] | if length == 0 then "missing" elif all(.draft == true) then "draft" else "published" end' <<<"$releases")
          case "$state" in
            missing)
              gh release create "$RELEASE_VERSION" --verify-tag --target "$RELEASE_COMMIT" --draft --title "Burrow $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md"
              ;;
            draft) ;;
            *) echo 'Published releases cannot be replaced.' >&2; exit 1 ;;
          esac
          gh release upload "$RELEASE_VERSION" release-assets/* --clobber
          gh release edit "$RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md"
          echo "Draft ready: https://github.com/$GITHUB_REPOSITORY/releases" >>"$GITHUB_STEP_SUMMARY"
          echo 'Verify attachments and image digests, then publish the draft. This workflow never publishes the Release itself.' >>"$GITHUB_STEP_SUMMARY"
