# Default configuration for native development. Compose overrides these values
# with BURROW_* variables from .env. Native commands never load .env.
env: dev

server:
  listen_addr: :8080
  issuer: http://localhost:8080
  static_dir: web/dist
  trusted_proxies: []

database:
  driver: sqlite
  dsn: burrow.db

security:
  # Public development example only; production rejects this value.
  # Generate a deployment key with: openssl rand -base64 32
  master_key: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
  # Used only when master_key is empty. Development creates a missing file
  # once (0600); production requires an existing file.
  master_key_file: data/master.key

session:
  ttl: 8h

oidc:
  token_ttl: 5m
  auth_code_ttl: 60s
  login_ttl: 10m

providers:
  allowed_cidrs: []
  allow_private: false

audit:
  retention: 2160h
