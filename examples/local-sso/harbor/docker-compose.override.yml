# Local overrides for the Compose generated by the official Harbor prepare image.
services:
  log:
    platform: linux/amd64
    container_name: burrow-local-sso-harbor-log
  registry:
    platform: linux/amd64
    container_name: burrow-local-sso-harbor-registry
  registryctl:
    platform: linux/amd64
    container_name: burrow-local-sso-harbor-registryctl
  postgresql:
    platform: linux/amd64
    container_name: burrow-local-sso-harbor-db
  core:
    platform: linux/amd64
    container_name: burrow-local-sso-harbor-core
    networks:
      harbor:
      sso:
  portal:
    platform: linux/amd64
    container_name: burrow-local-sso-harbor-portal
  jobservice:
    platform: linux/amd64
    container_name: burrow-local-sso-harbor-jobservice
  redis:
    platform: linux/amd64
    container_name: burrow-local-sso-harbor-valkey
  proxy:
    platform: linux/amd64
    container_name: burrow-local-sso-harbor-proxy
    # The outer local-sso Nginx is the only public HTTP entry point.
    ports: !reset []
    networks:
      harbor:
      sso:
        aliases: [harbor-proxy]
networks:
  sso:
    external: true
    name: burrow-local-sso_default
