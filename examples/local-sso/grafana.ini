; Public credentials for local development only.
[server]
protocol = http
http_port = 3000
domain = grafana.yakir.top
root_url = http://grafana.yakir.top/

[security]
admin_user = admin
admin_password = Grafana-development-admin-2026
cookie_secure = false
cookie_samesite = lax

[users]
auto_assign_org = true
auto_assign_org_role = Viewer

[auth]
disable_login_form = false

[auth.basic]
enabled = true

[auth.generic_oauth]
enabled = true
name = Burrow
client_id = grafana-example
client_secret = grafana-example-secret
scopes = openid profile email
auth_url = http://sso.yakir.top/oidc/authorize
token_url = http://sso.yakir.top/oidc/token
api_url = http://sso.yakir.top/oidc/userinfo
login_attribute_path = preferred_username
name_attribute_path = name
email_attribute_path = email
auth_style = InHeader
use_pkce = true
use_refresh_token = false
allow_sign_up = true
auto_login = false
skip_org_role_sync = true
allow_assign_grafana_admin = false
validate_id_token = true
jwk_set_url = http://sso.yakir.top/oidc/jwks

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
